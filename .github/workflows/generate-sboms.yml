name: Generate SBOMs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to attach SBOMs to (e.g., 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Generate SBOMs in parallel (3 frameworks × 2 SPDX versions = 6 jobs)
  generate-sbom:
    name: SBOM (${{ matrix.framework }}, SPDX ${{ matrix.spdx-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue generating other SBOMs even if one fails
      matrix:
        framework: ['net8.0', 'net9.0', 'net10.0']
        spdx-version: ['2.2', '3.0']
        include:
          - framework: 'net8.0'
            dotnet-version: '8.0.x'
          - framework: 'net9.0'
            dotnet-version: '9.0.x'
          - framework: 'net10.0'
            dotnet-version: '10.0.x'

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generating SBOM for version: $VERSION"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

      - name: Install Microsoft SBOM tool
        run: dotnet tool install --global Microsoft.Sbom.DotNetTool

      - name: Generate SBOM (SPDX ${{ matrix.spdx-version }})
        run: |
          sbom-tool generate \
            -b src/HeroSdJwt/bin/Release/${{ matrix.framework }} \
            -bc src/HeroSdJwt \
            -pn HeroSD-JWT \
            -pv ${{ steps.version.outputs.version }} \
            -ps KoalaFacts \
            -nsb https://github.com/KoalaFacts/HeroSD-JWT \
            -mi SPDX:${{ matrix.spdx-version }} \
            -m sbom-output \
            -V Verbose

      - name: Rename SBOM file
        run: |
          mkdir -p release-sboms
          find sbom-output/_manifest -name "*.spdx.json" -exec cp {} release-sboms/HeroSD-JWT.${{ steps.version.outputs.version }}.${{ matrix.framework }}.spdx-${{ matrix.spdx-version }}.json \;
          echo "SBOM file created:"
          ls -lh release-sboms/

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.framework }}-spdx${{ matrix.spdx-version }}
          path: release-sboms/*.spdx.json
          retention-days: 90

      - name: Attach SBOM to release
        run: |
          gh release upload v${{ steps.version.outputs.version }} \
            release-sboms/HeroSD-JWT.${{ steps.version.outputs.version }}.${{ matrix.framework }}.spdx-${{ matrix.spdx-version }}.json \
            --clobber
          echo "SBOM attached to release v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job that reports completion
  sbom-summary:
    name: SBOM Generation Summary
    needs: generate-sbom
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## SBOM Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.generate-sbom.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SBOMs Generated" >> $GITHUB_STEP_SUMMARY
          echo "Per-framework SBOMs attached to [release v${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net8.0.spdx-2.2.json" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net8.0.spdx-3.0.json" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net9.0.spdx-2.2.json" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net9.0.spdx-3.0.json" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net10.0.spdx-2.2.json" >> $GITHUB_STEP_SUMMARY
          echo "- HeroSD-JWT.${{ steps.version.outputs.version }}.net10.0.spdx-3.0.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total**: 6 SBOMs (3 frameworks × 2 SPDX formats)" >> $GITHUB_STEP_SUMMARY
