name: Setup and Restore (Reusable)

on:
  workflow_call:
    inputs:
      framework:
        description: 'Target framework (e.g., net8.0)'
        required: false
        type: string
    outputs:
      success:
        description: 'Whether the setup and restore succeeded'
        value: ${{ jobs.setup-restore.outputs.success }}

jobs:
  setup-restore:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.restore.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Restore dependencies
        id: restore
        run: |
          if [ -n "${{ inputs.framework }}" ]; then
            dotnet restore -p:TargetFramework=${{ inputs.framework }}
          else
            dotnet restore
          fi
