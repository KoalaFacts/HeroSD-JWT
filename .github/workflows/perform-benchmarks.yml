name: Perform Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/scripts/**'
      - '.github/workflows/perform-benchmarks.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/scripts/**'
      - '.github/workflows/perform-benchmarks.yml'
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # For committing baseline
  pull-requests: write  # For posting comments
  deployments: write  # For GitHub Pages

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  BENCHMARK_ALERT_THRESHOLD: '105%'

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  benchmark:
    name: Run Performance Benchmarks
    needs: setup
    runs-on: ubuntu-latest  # Consistent environment for comparisons
    strategy:
      fail-fast: false
      # Publishing frameworks share one branch. Serialize main publishers rather
      # than retry/rebase an already validated commit onto unvalidated history.
      max-parallel: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 1 || 3 }}
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup all .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Test benchmark evidence validation
      run: python3 -m unittest discover -s .github/scripts/tests

    - name: Restore dependencies (all frameworks, locked mode)
      run: dotnet restore

    - name: Build benchmarks ${{ matrix.framework }}
      run: |
        dotnet build benchmarks/HeroSdJwt.Benchmarks/HeroSdJwt.Benchmarks.csproj \
          --configuration Release \
          --framework ${{ matrix.framework }} \
          --no-restore

    - name: Run benchmarks ${{ matrix.framework }}
      run: |
        cd benchmarks/HeroSdJwt.Benchmarks
        dotnet run -c Release \
          --framework ${{ matrix.framework }} \
          --filter "*" \
          --job short \
          --exporters json

    - name: Collect complete current benchmark evidence ${{ matrix.framework }}
      env:
        FRAMEWORK: ${{ matrix.framework }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/collect_benchmark_reports.py \
          "$REPORT_DIR" "$FRAMEWORK" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

    # Historical acceptance is independent of current report completeness. Keep
    # this a required failing step, but retain new diagnostics before it runs.
    - name: Validate framework-specific benchmark baseline
      id: baseline
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        git fetch --no-tags origin gh-pages
        git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/benchmark-baseline.js"
        python3 .github/scripts/validate_benchmark_baseline.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" "$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Validate job identities and snapshot performance before storage
      id: comparison
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/prepare_benchmark_comparison.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" \
          "$REPORT_DIR/combined-report-$FRAMEWORK.json" \
          "$REPORT_DIR/comparison-report-$FRAMEWORK.json" "$CURRENT_COMMIT" \
          --check "$BENCHMARK_ALERT_THRESHOLD"

    # The action prepares a local gh-pages commit, then checks its own alerts.
    # Never let it push before those alerts or our exact-parent validation.
    - name: Prepare local benchmark result ${{ matrix.framework }}
      id: storebenchmark
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: ${{ steps.baseline.outputs.name }}
        tool: 'benchmarkdotnet'
        output-file-path: benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/comparison-report-${{ matrix.framework }}.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Match CURRENT_COMMIT: PR head, or the pinned event SHA for push/dispatch.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        comment-on-alert: true
        fail-on-alert: true
        alert-threshold: ${{ env.BENCHMARK_ALERT_THRESHOLD }}  # Fail if >5% slower
        comment-always: true
        benchmark-data-dir-path: 'dev/bench'
        auto-push: false
        summary-always: true
        gh-pages-branch: 'gh-pages'
        save-data-file: true

    - name: Enforce verified snapshot performance gate
      if: always() && steps.comparison.outcome == 'success'
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # The store action refetches gh-pages. A concurrent update must not bypass
        # the exact baseline whose job identities were validated for this run.
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/prepare_benchmark_comparison.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" \
          "$REPORT_DIR/combined-report-$FRAMEWORK.json" \
          "$REPORT_DIR/comparison-report-$FRAMEWORK.json" "$CURRENT_COMMIT" \
          --check "$BENCHMARK_ALERT_THRESHOLD"

    - name: Validate prepared benchmark commit
      id: publication
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/validate_benchmark_publication.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" \
          "$REPORT_DIR/combined-report-$FRAMEWORK.json" "$CURRENT_COMMIT" \
          "$BENCHMARK_ALERT_THRESHOLD" >> "$GITHUB_OUTPUT"

    - name: Publish verified benchmark commit
      id: publishbenchmark
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        VERIFIED_COMMIT: ${{ steps.publication.outputs.commit }}
      run: |
        # Push only the immutable checked commit using checkout's existing auth.
        # A competing forward/divergent update fails, without force/rebase/retry.
        git push origin "$VERIFIED_COMMIT:refs/heads/gh-pages"

    - name: Upload benchmark artifacts ${{ matrix.framework }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: benchmark-results-${{ matrix.framework }}
        # Keep raw evidence even when the comparison step fails or emits no output.
        # Limit uploads to reports/logs, excluding generated builds and repository files.
        path: |
          benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/*.log
          benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/*.json
        if-no-files-found: warn
        include-hidden-files: false
        retention-days: 30
