name: Perform Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/perform-benchmarks.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # For committing baseline
  pull-requests: write  # For posting comments
  deployments: write  # For GitHub Pages

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_LOCKED_MODE: true

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest  # Consistent environment for comparisons
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']
        include:
          - dotnet-version: '8.0.x'
            framework: 'net8.0'
          - dotnet-version: '9.0.x'
            framework: 'net9.0'
          - dotnet-version: '10.0.x'
            framework: 'net10.0'
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore dependencies
      run: dotnet restore -p:TargetFramework=${{ matrix.framework }} 

    - name: Build benchmarks ${{ matrix.dotnet-version }}
      run: |
        dotnet build benchmarks/HeroSdJwt.Benchmarks/HeroSdJwt.Benchmarks.csproj \
          --configuration Release \
          --framework ${{ matrix.framework }} \
          --no-restore

    - name: Run benchmarks ${{ matrix.dotnet-version }}
      run: |
        cd benchmarks/HeroSdJwt.Benchmarks
        dotnet run -c Release \
          --framework ${{ matrix.framework }} \
          --filter "*" \
          --job short \
          --exporters json

    - name: Combine benchmark reports ${{ matrix.dotnet-version }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        OUTPUT_FILE=${REPORT_DIR}/combined-report-${{ matrix.framework }}.json

        if [ ! -d "$REPORT_DIR" ]; then
          echo "Error: BenchmarkDotNet results directory not found: $REPORT_DIR"
          exit 1
        fi

        FILES=$(find "$REPORT_DIR" -maxdepth 1 -name "*-report-full.json" -print)

        if [ -z "$FILES" ]; then
          echo "Error: No BenchmarkDotNet JSON reports found in $REPORT_DIR"
          exit 1
        fi

        # Merge all Benchmarks arrays into one file while keeping the first file's metadata
        jq -s '.[0] * {Benchmarks: (map(.Benchmarks // []) | add)}' $FILES > "$OUTPUT_FILE"
        echo "Combined benchmark report: $OUTPUT_FILE"

    - name: Store benchmark result ${{ matrix.dotnet-version }}
      id: storebenchmark
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'benchmarkdotnet'
        output-file-path: benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/combined-report-${{ matrix.framework }}.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        comment-on-alert: true
        fail-on-alert: true
        alert-threshold: '105%'  # Fail if >5% slower
        comment-always: true
        benchmark-data-dir-path: 'dev/bench'
        auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        summary-always: true
        gh-pages-branch: 'gh-pages'
        save-data-file: true

    - name: Upload benchmark artifacts ${{ matrix.dotnet-version }}
      uses: actions/upload-artifact@v5
      if: always() && steps.storebenchmark.outputs.benchmark-result-file-path != ''
      with:
        name: benchmark-results-${{ matrix.framework }}
        path: ${{ steps.storebenchmark.outputs.benchmark-result-file-path }}
        retention-days: 30
