name: Perform Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/scripts/**'
      - '.github/workflows/perform-benchmarks.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/scripts/**'
      - '.github/workflows/perform-benchmarks.yml'
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # For committing baseline
  pull-requests: write  # For posting comments
  deployments: write  # For GitHub Pages

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  BENCHMARK_ALERT_THRESHOLD: '105%'

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  benchmark:
    name: Run Performance Benchmarks
    needs: setup
    runs-on: ubuntu-latest  # Consistent environment for comparisons
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup all .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Validate framework-specific benchmark baseline
      id: baseline
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python3 -m unittest discover -s .github/scripts/tests
        git fetch --no-tags origin gh-pages
        git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/benchmark-baseline.js"
        python3 .github/scripts/validate_benchmark_baseline.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" "$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies (all frameworks, locked mode)
      run: dotnet restore

    - name: Build benchmarks ${{ matrix.framework }}
      run: |
        dotnet build benchmarks/HeroSdJwt.Benchmarks/HeroSdJwt.Benchmarks.csproj \
          --configuration Release \
          --framework ${{ matrix.framework }} \
          --no-restore

    - name: Run benchmarks ${{ matrix.framework }}
      run: |
        cd benchmarks/HeroSdJwt.Benchmarks
        dotnet run -c Release \
          --framework ${{ matrix.framework }} \
          --filter "*" \
          --job short \
          --exporters json

    - name: Combine benchmark reports ${{ matrix.framework }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        OUTPUT_FILE=${REPORT_DIR}/combined-report-${{ matrix.framework }}.json

        if [ ! -d "$REPORT_DIR" ]; then
          echo "Error: BenchmarkDotNet results directory not found: $REPORT_DIR"
          exit 1
        fi

        FILES=$(find "$REPORT_DIR" -maxdepth 1 -name "*-report-full*.json" -print)

        if [ -z "$FILES" ]; then
          echo "Error: No BenchmarkDotNet JSON reports found in $REPORT_DIR"
          exit 1
        fi

        # Merge all Benchmarks arrays into one file while keeping the first file's metadata
        jq -s '.[0] * {Benchmarks: (map(.Benchmarks // []) | add)}' $FILES > "$OUTPUT_FILE"
        echo "Combined benchmark report: $OUTPUT_FILE"

    - name: Validate job identities and prepare comparison report
      id: comparison
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/prepare_benchmark_comparison.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" \
          "$REPORT_DIR/combined-report-$FRAMEWORK.json" \
          "$REPORT_DIR/comparison-report-$FRAMEWORK.json" "$CURRENT_COMMIT"

    # Requires the 'gh-pages' branch to exist: the action fetches it to read the
    # baseline (and, on pushes to main, appends history under dev/bench/). If the
    # branch is missing the step fails with "couldn't find remote ref gh-pages".
    - name: Store benchmark result ${{ matrix.framework }}
      id: storebenchmark
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: ${{ steps.baseline.outputs.name }}
        tool: 'benchmarkdotnet'
        output-file-path: benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/comparison-report-${{ matrix.framework }}.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Pin metadata for workflow_dispatch, whose branch may move during the run.
        ref: ${{ github.sha }}
        comment-on-alert: true
        fail-on-alert: true
        alert-threshold: ${{ env.BENCHMARK_ALERT_THRESHOLD }}  # Fail if >5% slower
        comment-always: true
        benchmark-data-dir-path: 'dev/bench'
        auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        summary-always: true
        gh-pages-branch: 'gh-pages'
        save-data-file: true

    - name: Enforce verified snapshot performance gate
      if: always() && steps.comparison.outcome == 'success'
      env:
        FRAMEWORK: ${{ matrix.framework }}
        CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # The store action refetches gh-pages. A concurrent update must not bypass
        # the exact baseline whose job identities were validated for this run.
        REPORT_DIR=benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results
        python3 .github/scripts/prepare_benchmark_comparison.py \
          "$RUNNER_TEMP/benchmark-baseline.js" "$FRAMEWORK" \
          "$REPORT_DIR/combined-report-$FRAMEWORK.json" \
          "$REPORT_DIR/comparison-report-$FRAMEWORK.json" "$CURRENT_COMMIT" \
          --check "$BENCHMARK_ALERT_THRESHOLD"

    - name: Upload benchmark artifacts ${{ matrix.framework }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: benchmark-results-${{ matrix.framework }}
        # Keep raw evidence even when the comparison step fails or emits no output.
        # Limit uploads to reports/logs, excluding generated builds and repository files.
        path: |
          benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/*.log
          benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/*.json
        if-no-files-found: warn
        include-hidden-files: false
        retention-days: 30
