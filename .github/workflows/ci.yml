name: Build and Test

on:
  push:
    branches: [ '*' ]
    tags: [ 'v*' ]  # Run on version tags for artifact generation
  pull_request:
    branches: [ main, develop ]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write  # For dependency review

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  build-and-test:
    name: Build and Test
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        fetch-depth: 0  # Full history for Source Link

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Run tests
      run: dotnet test --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
      if: always() && matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
      with:
        files: 'TestResults/**/*.trx'
        check_name: 'Test Results (${{ matrix.os }} - ${{ matrix.framework }})'

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.framework }}
        path: TestResults/**/*.trx
        retention-days: 30

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
      with:
        files: 'TestResults/**/coverage.cobertura.xml'
        fail_ci_if_error: false
        flags: unittests
        name: codecov-${{ matrix.os }}

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (with warnings as errors)
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        fetch-depth: 0  # Need full history for comparing commits on push events

    - name: Dependency Review
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      with:
        fail-on-severity: high
        deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
        comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
        # For push events, compare against previous commit
        # For PRs, these are automatically detected
        base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
        head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
