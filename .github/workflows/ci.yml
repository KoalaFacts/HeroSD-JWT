name: Build and Test

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    tags: [ 'v*' ]  # Run on version tags for artifact generation
  pull_request:
    branches: [ main, develop ]
  merge_group:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Allow committing generated lock files
  checks: write
  pull-requests: write
  security-events: write  # For dependency review

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup-matrix:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      dotnet-versions: ${{ steps.extract-versions.outputs.versions }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract SDK versions from Directory.Build.props
      id: extract-versions
      run: |
        # Extract SupportedSdkVersions from Directory.Build.props
        SDK_VERSIONS=$(grep -oP '(?<=<SupportedSdkVersions>)[^<]+' Directory.Build.props | sed 's/;/","/g')
        # Convert to JSON array format
        JSON_ARRAY="[\"${SDK_VERSIONS}\"]"
        echo "versions=${JSON_ARRAY}" >> $GITHUB_OUTPUT
        echo "Detected SDK versions: ${JSON_ARRAY}"

  build-and-test:
    name: Build and Test
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ${{ fromJson(needs.setup-matrix.outputs.dotnet-versions) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Full history for Source Link

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: false  # Disabled until packages.lock.json is generated

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for new lock files
      id: lock-files
      if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x' && github.event_name == 'push'
      run: |
        if git diff --name-only | grep -q "packages.lock.json"; then
          echo "LOCK_FILES_GENERATED=true" >> $GITHUB_OUTPUT
          echo "Lock files were generated"
          git diff --name-only | grep "packages.lock.json"
        else
          echo "LOCK_FILES_GENERATED=false" >> $GITHUB_OUTPUT
          echo "No new lock files generated"
        fi

    - name: Commit lock files
      if: steps.lock-files.outputs.LOCK_FILES_GENERATED == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add '**/packages.lock.json'
        git commit -m "$(cat <<'EOF'
        chore: add generated NuGet lock files

        These lock files were automatically generated by Directory.Build.props configuration.
        They ensure reproducible builds by locking dependency versions.

        [skip ci]
        EOF
        )"
        git push

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && runner.os == 'Linux' && matrix.dotnet-version == '10.0.x'
      with:
        files: 'TestResults/**/*.trx'
        check_name: 'Test Results (${{ matrix.os }} - .NET ${{ matrix.dotnet-version }})'

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.dotnet-version }}
        path: TestResults/**/*.trx
        retention-days: 30

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x'
      uses: codecov/codecov-action@v5
      with:
        files: 'TestResults/**/coverage.cobertura.xml'
        fail_ci_if_error: false
        flags: unittests
        name: codecov-${{ matrix.os }}

  code-quality:
    name: Code Quality
    needs: setup-matrix
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # Use the latest SDK version from supported versions
        dotnet-version: ${{ fromJson(needs.setup-matrix.outputs.dotnet-versions)[2] }}
        cache: false  # Disabled until packages.lock.json is generated

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (with warnings as errors)
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [setup-matrix, build-and-test, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # Use the latest SDK version from supported versions
        dotnet-version: ${{ fromJson(needs.setup-matrix.outputs.dotnet-versions)[2] }}
        cache: false  # Disabled until packages.lock.json is generated

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      run: |
        dotnet pack src/HeroSdJwt/HeroSdJwt.csproj \
          --configuration Release \
          --no-build \
          --output ./artifacts \
          /p:IncludeSymbols=true \
          /p:SymbolPackageFormat=snupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v5
      with:
        name: nuget-packages-${{ github.sha }}
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        retention-days: 90
        if-no-files-found: error

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
        comment-summary-in-pr: always
