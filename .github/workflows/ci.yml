name: Build and Test

on:
  push:
    branches: [ '*' ]
    tags: [ 'v*' ]  # Run on version tags for artifact generation
  pull_request:
    branches: [ main, develop ]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # For dependency review PR comment
  security-events: write  # For dependency review

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  build-and-test:
    name: Build and Test
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0  # Full history for Source Link

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Run tests
      run: dotnet test --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    # Native test-result summary (no third-party action / no extra permissions).
    - name: Publish test results summary
      if: always()
      shell: bash
      run: |
        # Portable across bash 3.2 (macOS) and 4/5: no globstar, find instead of **.
        trx_files=$(find TestResults -name '*.trx' 2>/dev/null || true)
        {
          echo "## Test Results — ${{ matrix.os }} / ${{ matrix.framework }}"
          if [ -z "$trx_files" ]; then
            echo "_No test result (.trx) files were produced._"
          else
            passed=0; failed=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              p=$({ grep -oh 'outcome="Passed"' "$f" || true; } | wc -l | tr -d '[:space:]')
              q=$({ grep -oh 'outcome="Failed"' "$f" || true; } | wc -l | tr -d '[:space:]')
              passed=$((passed + p))
              failed=$((failed + q))
            done <<< "$trx_files"
            echo ""
            echo "| Result | Count |"
            echo "| --- | ----: |"
            echo "| ✅ Passed | $passed |"
            echo "| ❌ Failed | $failed |"
            if [ "$failed" -gt 0 ]; then
              echo ""
              echo "<details><summary>Failed tests</summary>"
              echo ""
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                { grep -o 'testName="[^"]*"[^>]*outcome="Failed"' "$f" || true; } \
                  | sed -E 's/.*testName="([^"]*)".*/- `\1`/'
              done <<< "$trx_files" | sort -u
              echo ""
              echo "</details>"
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.framework }}
        path: TestResults/**/*.trx
        retention-days: 30

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: 'TestResults/**/coverage.cobertura.xml'
        fail_ci_if_error: false
        flags: unittests
        name: codecov-${{ matrix.os }}

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (with warnings as errors)
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0  # Need full history for comparing commits on push events

    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
        comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
        # For push events, compare against previous commit
        # For PRs, these are automatically detected
        base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
        head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
