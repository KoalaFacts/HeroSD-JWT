# Microsoft Security DevOps Analysis
# This workflow runs security analysis tools from Microsoft Security DevOps (formerly Guardian)
# For documentation, visit: https://github.com/microsoft/security-devops-action
name: Security DevOps

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '25 6 * * 6'  # Weekly scan on Saturday

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write  # Required for Microsoft Defender for Cloud integration

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  security-scan:
    name: Security Scan (.NET ${{ matrix.dotnet-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']
        include:
          - dotnet-version: '8.0.x'
            framework: 'net8.0'
          - dotnet-version: '9.0.x'
            framework: 'net9.0'
          - dotnet-version: '10.0.x'
            framework: 'net10.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup .NET 6.0 (required by Microsoft Security DevOps tools)
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    # Run Microsoft Security DevOps analysis
    - name: Run Microsoft Security DevOps
      uses: microsoft/security-devops-action@v1
      id: msdo
      with:
        # Configure which tools to run
        # Available tools: antimalware, binskim, credscan, eslint, templateanalyzer, terrascan, trivy
        tools: 'binskim,credscan'
        # Break build on critical/high vulnerabilities (optional)
        break: false
        # Publish results to Microsoft Defender for Cloud (requires id-token permission)
        publish: true

    # Upload results to GitHub Security tab
    - name: Upload Security Results to GitHub
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}

    # Upload detailed results as artifacts
    - name: Upload Security DevOps Results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: security-devops-results-${{ matrix.dotnet-version }}
        path: |
          .gdn/**
          ${{ steps.msdo.outputs.sarifFile }}
        retention-days: 90
