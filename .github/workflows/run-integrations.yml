name: Run Nightly Integration Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write  # For creating issues on failures

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  integration-tests:
    name: Integration Tests
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Run integration tests
      run: dotnet test --configuration Release --no-build --framework ${{ matrix.framework }} --filter "Category=Integration" --verbosity normal --logger "trx;LogFileName=integration-test-results.trx" --results-directory ./TestResults/Integration
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: nightly-test-results-${{ matrix.os }}-${{ matrix.framework }}
        path: TestResults/**/*.trx
        retention-days: 90

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: nightly-coverage-${{ matrix.os }}-${{ matrix.framework }}
        path: TestResults/**/coverage.cobertura.xml
        retention-days: 90

  examples-validation:
    name: Validate Examples
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build examples
      run: dotnet build examples --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Test AspNetCoreIntegrationExample builds
      run: dotnet build examples/AspNetCoreIntegrationExample --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Test MultiTenantAuthExample builds
      run: dotnet build examples/MultiTenantAuthExample --configuration Release --no-restore --framework ${{ matrix.framework }}

  benchmarks:
    name: Run Benchmarks
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run benchmarks
      run: |
        cd benchmarks/HeroSdJwt.Benchmarks
        dotnet run -c Release --framework net10.0 --filter "*" --job short --exporters json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v5
      with:
        name: nightly-benchmark-results
        path: benchmarks/HeroSdJwt.Benchmarks/BenchmarkDotNet.Artifacts/results/*
        retention-days: 90

  package-validation:
    name: Package Validation
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack HeroSdJwt
      run: dotnet pack src/HeroSdJwt/HeroSdJwt.csproj --configuration Release --no-build --output ./nupkg

    - name: Pack HeroSdJwt.AspNetCore
      run: dotnet pack src/HeroSdJwt.AspNetCore/HeroSdJwt.AspNetCore.csproj --configuration Release --no-build --output ./nupkg

    - name: Validate packages
      run: |
        dotnet tool install --global dotnet-validate --version 0.0.1-preview.304
        dotnet validate package local ./nupkg/*.nupkg

    - name: Upload packages
      uses: actions/upload-artifact@v5
      with:
        name: nightly-packages
        path: ./nupkg/*.nupkg
        retention-days: 30

  security-scan:
    name: Security Scan
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run security audit
      run: dotnet list package --vulnerable --include-transitive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Build for CodeQL
      run: dotnet build --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  summary:
    name: Nightly Summary
    needs: [integration-tests, examples-validation, benchmarks, package-validation, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "## Nightly Integration Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Examples Validation: ${{ needs.examples-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Benchmarks: ${{ needs.benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Package Validation: ${{ needs.package-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY

    - name: Create issue on failure
      if: |
        needs.integration-tests.result == 'failure' ||
        needs.examples-validation.result == 'failure' ||
        needs.benchmarks.result == 'failure' ||
        needs.package-validation.result == 'failure' ||
        needs.security-scan.result == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const title = `Nightly Integration Tests Failed - ${new Date().toISOString().split('T')[0]}`;
          const body = `## Nightly Integration Test Failures

          One or more nightly integration jobs failed:

          - Integration Tests: ${{ needs.integration-tests.result }}
          - Examples Validation: ${{ needs.examples-validation.result }}
          - Benchmarks: ${{ needs.benchmarks.result }}
          - Package Validation: ${{ needs.package-validation.result }}
          - Security Scan: ${{ needs.security-scan.result }}

          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please investigate and fix the failing tests.`;

          // Check if an issue already exists for today
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'nightly-test-failure',
            per_page: 5
          });

          const existingIssue = issues.data.find(issue => issue.title === title);

          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['nightly-test-failure', 'automated']
            });
          }
